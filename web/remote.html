<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Controle Aurora</title><link rel="stylesheet" href="style.css"><body><main class="remote"><div class="brand">✳ AURORA TV</div><h1>Na palma da mão.</h1><p id="status" role="status">Digite o código exibido na televisão.</p><form id="pairForm"><input id="code" placeholder="Código de 6 dígitos" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="Código de pareamento"><button class="primary">Conectar à TV</button></form><section id="controls" hidden><p id="now"></p><div class="pad"><span></span><button data-c="up">↑</button><span></span><button data-c="left">←</button><button class="primary" data-c="ok">OK</button><button data-c="right">→</button><span></span><button data-c="down">↓</button></div><div class="actions"><button data-c="back">Voltar</button><button data-c="home">Início</button></div><div class="actions"><button data-c="rewind">−10s</button><button data-c="play">▶ / Ⅱ</button><button data-c="forward">+10s</button></div><div class="actions"><button data-c="volumedown">Volume −</button><button data-c="volumeup">Volume +</button></div><form id="searchForm"><input id="query" placeholder="Buscar na TV" aria-label="Buscar na TV"><button>Buscar</button></form></section></main><script src="remote.js"></script></body></html>
