name: Aplicativo Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-app.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de compilação
        run: python -m pip install -r desktop/requirements.txt pyinstaller==6.12.0
      - name: Testar biblioteca e backend
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest discover -s tests -v
      - name: Verificar inicialização QML
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m desktop.app --windowed --smoke
      - name: Gerar aplicativo portátil
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name AuroraTV --add-data "desktop/Main.qml;."
          --hidden-import PySide6.QtQuick
          --hidden-import PySide6.QtMultimedia
          --hidden-import PySide6.QtQuickControls2
          desktop/app.py
      - name: Incluir instruções
        run: Copy-Item desktop/COMO-ABRIR.txt dist/AuroraTV/COMO-ABRIR.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-Windows
          path: dist/AuroraTV/
          retention-days: 30
